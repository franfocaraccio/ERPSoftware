name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo sobre la misma rama cancela la corrida anterior: no tiene
# sentido pagar minutos por verificar un commit que ya quedó atrás.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest

    # Postgres efímero al lado del job. Los tests de integración corren contra
    # una base real con RLS activo; no usamos Testcontainers porque el
    # aislamiento entre tests ya lo da RLS (ver packages/backend/src/test/).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # pnpm antes que setup-node: `cache: pnpm` necesita el binario para
      # ubicar el store. La versión sale de "packageManager" en package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Con el rol OWNER, igual que en local. Además de preparar la base para
      # los tests, esto verifica que la cadena de migraciones aplica desde cero
      # —incluidas las políticas de RLS y la creación del rol erp_app—, que es
      # exactamente lo que va a pasar contra Supabase.
      - name: Migraciones
        run: pnpm --filter @erp/backend db:migrate
        env:
          DATABASE_URL_MIGRATIONS: postgresql://erp:erp@localhost:5432/erp

      # Con el rol de la app (sin BYPASSRLS): si una query se escapara del
      # wrapper withTenant, acá se cae.
      # Con cobertura, para no correr la suite dos veces. El reporte se sube
      # como artifact: no hay badge todavía porque publicarlo pide conectar el
      # repo a un servicio, y eso es una decisión, no un paso de CI.
      - name: Tests
        run: pnpm test:coverage
        env:
          DATABASE_URL: postgresql://erp_app:erp_app@localhost:5432/erp
          # Hoy ningún test importa auth.ts, que aborta el proceso si falta.
          # Está puesto para que agregar uno no falle solo en CI.
          BETTER_AUTH_SECRET: ci-no-es-un-secreto-real

      - name: Resumen de cobertura
        if: always()
        run: |
          echo "## Cobertura" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Paquete | Líneas | Ramas | Funciones |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for f in packages/*/coverage/coverage-summary.json; do
            [ -f "$f" ] || continue
            paquete=$(echo "$f" | cut -d/ -f2)
            node -e "
              const t = require('./$f').total;
              const p = (x) => x.pct.toFixed(1) + ' %';
              console.log('| $paquete | ' + p(t.lines) + ' | ' + p(t.branches) + ' | ' + p(t.functions) + ' |');
            " >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Subir la cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: packages/*/coverage/
          retention-days: 14

      - name: Build
        run: pnpm build

  # End-to-end del flujo principal, contra la aplicación levantada de verdad.
  #
  # Va en su propio job, en paralelo con `verificar`: duplica el arranque de
  # Postgres, y a cambio no suma su tiempo al del resto. Lo que sí hace es
  # frenar el deploy si se rompe —`migrar-dev` lo espera— y eso es a
  # propósito: si vender, cobrar o ver el saldo dejó de funcionar, lo último
  # que hay que hacer es subirlo.
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://erp_app:erp_app@localhost:5432/erp
      DATABASE_URL_MIGRATIONS: postgresql://erp:erp@localhost:5432/erp
      BETTER_AUTH_SECRET: ci-no-es-un-secreto-real
      FRONTEND_URL: http://localhost:5173
      VITE_API_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Migraciones
        run: pnpm --filter @erp/backend db:migrate

      # Crea el admin de plataforma y la organización de prueba con la que
      # entran los tests. Es idempotente.
      - name: Seed
        run: pnpm --filter @erp/backend db:seed

      - name: Navegador
        run: pnpm --filter @erp/e2e exec playwright install --with-deps chromium

      # Playwright levanta backend y frontend por su cuenta (ver
      # playwright.config.ts) y espera a que /health conteste.
      - name: End-to-end
        run: pnpm --filter @erp/e2e e2e

      - name: Subir el reporte si falló
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-fallido
          path: packages/e2e/test-results/
          retention-days: 7

  # Aplica las migraciones al entorno de desarrollo real, después de que todo
  # lo anterior pasó. Va acá y no en el contenedor de Railway a propósito: las
  # migraciones necesitan el rol dueño, que puede saltear RLS, y esa credencial
  # no tiene por qué vivir en un proceso expuesto a internet 24/7. Acá vive en
  # los secrets de GitHub y solo existe durante este job.
  #
  # Railway tiene "Wait for CI" activado, así que el orden queda garantizado:
  # tests -> migraciones -> deploy. Si esto falla, el código nuevo no sube.
  migrar-dev:
    needs: [verificar, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: erp-dev

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Mientras el secret no esté cargado, este paso se saltea en vez de
      # fallar. Si fallara, el CI quedaría en rojo y —por "Wait for CI"—
      # bloquearía todos los deploys hasta terminar de configurar GitHub.
      # drizzle-kit falla sin decir por qué cuando no puede conectarse: imprime
      # "applying migrations..." y sale con 1. Esto lo convierte en un
      # diagnóstico, que es la diferencia entre mirar el log y entender nada o
      # saber que el proyecto de Supabase se pausó por inactividad.
      - name: ¿Contesta la base?
        env:
          DATABASE_URL_MIGRATIONS: ${{ secrets.DATABASE_URL_MIGRATIONS }}
        run: |
          if [ -z "$DATABASE_URL_MIGRATIONS" ]; then
            echo "Sin secret: no hay base a la que preguntarle."
            exit 0
          fi
          if ! psql "$DATABASE_URL_MIGRATIONS" -c "select 1" > /dev/null; then
            echo "::error::No se pudo conectar a erp-dev. Si el error de arriba habla de timeout o de DNS, lo más probable es que el proyecto de Supabase esté pausado por inactividad: entrá al panel y reactivalo."
            exit 1
          fi
          echo "La base contesta."

      - name: Migrar erp-dev
        env:
          DATABASE_URL_MIGRATIONS: ${{ secrets.DATABASE_URL_MIGRATIONS }}
        run: |
          if [ -z "$DATABASE_URL_MIGRATIONS" ]; then
            echo "::warning::Falta el secret DATABASE_URL_MIGRATIONS en el entorno erp-dev. Las migraciones NO se aplicaron."
            exit 0
          fi
          pnpm --filter @erp/backend db:migrate
